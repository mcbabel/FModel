name: FModel Linux Builder

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [ linux-x64 ]

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: .NET 10 Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build natives dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: .NET Publish
        run: ./linux/build.sh ${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FModel-${{ matrix.rid }}
          path: FModel-${{ matrix.rid }}.tar.gz
